<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 468" width="744" height="468" role="img" aria-label="WPA2/WPA3 key hierarchy: PSK, SAE or EAP produce the PMK, which with both nonces and MAC addresses produces the PTK, split into KCK, KEK and TK; the AP's GTK protects broadcast traffic.">
<style>
.bg{fill:#FFFFFF;stroke:#D3DBE1;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#15212B}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#56646F}
.ink{fill:#15212B}
.axis{stroke:#56646F;stroke-width:1;fill:none}
.grid{stroke:#D3DBE1;stroke-width:1;fill:none}
.ch-main{fill:#B25F08;fill-opacity:.16;stroke:#B25F08;stroke-width:2}
.ch-other{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#B25F08}.f5{fill:#0A7381}.f6{fill:#6947BF}
.t24{fill:#B25F08}.t5{fill:#0A7381}.t6{fill:#6947BF}
.mk{fill:#1E4E8C}.mk-ink{fill:#15212B}
.ray{stroke:#1E4E8C;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#15212B;stroke-width:3;fill:none}
.hatch{stroke:#56646F;stroke-width:1;fill:none}
.guide{stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#DAEFF1;stroke:none}
.block{fill:#56646F;fill-opacity:.55;stroke:none}
.block-soft{fill:#0A7381;fill-opacity:.22;stroke:#0A7381;stroke-width:1}
.shadow{fill:#56646F;fill-opacity:.12;stroke:none}
.wave{stroke:#0A7381;stroke-width:1.5;fill:none}
.particle{fill:#15212B}
.lifeline{stroke:#D3DBE1;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#EAEFF3;stroke:#D3DBE1;stroke-width:1}
.msg{stroke:#15212B;stroke-width:1.8;fill:none}
.msg.wired{stroke:#56646F;stroke-dasharray:5 4}
.note{fill:#EAEFF3;stroke:none}
.pre{fill:#E2EBF7;stroke:none}
.done{fill:#DFF0E6;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#FFFFFF;stroke-width:1.6}
.kb{fill:#EAEFF3;stroke:none}
.kb-acc{fill:#E2EBF7;stroke:none}
.kb-gtk{fill:#DAEFF1;stroke:none}
.kt-acc{fill:#1E4E8C}
.kt-gtk{fill:#0A7381}
.kline{stroke:#56646F;stroke-width:1.5;fill:none}
@media (prefers-color-scheme: dark){
.bg{fill:#141C23;stroke:#29353F;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E2E8ED}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#98A5AF}
.ink{fill:#E2E8ED}
.axis{stroke:#98A5AF;stroke-width:1;fill:none}
.grid{stroke:#29353F;stroke-width:1;fill:none}
.ch-main{fill:#EDA24E;fill-opacity:.16;stroke:#EDA24E;stroke-width:2}
.ch-other{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#EDA24E}.f5{fill:#4CC1CD}.f6{fill:#AE95F3}
.t24{fill:#EDA24E}.t5{fill:#4CC1CD}.t6{fill:#AE95F3}
.mk{fill:#8DB4EE}.mk-ink{fill:#E2E8ED}
.ray{stroke:#8DB4EE;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#E2E8ED;stroke-width:3;fill:none}
.hatch{stroke:#98A5AF;stroke-width:1;fill:none}
.guide{stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#0E2A2E;stroke:none}
.block{fill:#98A5AF;fill-opacity:.55;stroke:none}
.block-soft{fill:#4CC1CD;fill-opacity:.22;stroke:#4CC1CD;stroke-width:1}
.shadow{fill:#98A5AF;fill-opacity:.12;stroke:none}
.wave{stroke:#4CC1CD;stroke-width:1.5;fill:none}
.particle{fill:#E2E8ED}
.lifeline{stroke:#29353F;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#1C2630;stroke:#29353F;stroke-width:1}
.msg{stroke:#E2E8ED;stroke-width:1.8;fill:none}
.msg.wired{stroke:#98A5AF;stroke-dasharray:5 4}
.note{fill:#1C2630;stroke:none}
.pre{fill:#1A2A3E;stroke:none}
.done{fill:#13281C;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#141C23;stroke-width:1.6}
.kb{fill:#1C2630;stroke:none}
.kb-acc{fill:#1A2A3E;stroke:none}
.kb-gtk{fill:#0E2A2E;stroke:none}
.kt-acc{fill:#8DB4EE}
.kt-gtk{fill:#4CC1CD}
.kline{stroke:#98A5AF;stroke-width:1.5;fill:none}
}</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-ink"/></marker>
<pattern id="dfs-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="f5"/><line x1="0" y1="0" x2="0" y2="5" class="hatch-line"/></pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="743" height="467" rx="10"/>
<g transform="translate(12,12)">
<rect x="10" y="0" width="220" height="72" rx="7" class="kb"/>
<text x="120.0" y="20" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">WPA2-Personal</text>
<text x="120.0" y="38" text-anchor="middle" font-size="12" class="t-muted">PBKDF2(passphrase, SSID, 4096)</text>
<text x="120.0" y="54" text-anchor="middle" font-size="12" class="t-muted">same for every client</text>
<line x1="120" y1="72" x2="290" y2="110" class="kline" marker-end="url(#arr-ink)"/>
<rect x="250" y="0" width="220" height="72" rx="7" class="kb"/>
<text x="360.0" y="20" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">WPA3-Personal</text>
<text x="360.0" y="38" text-anchor="middle" font-size="12" class="t-muted">output of the SAE exchange</text>
<text x="360.0" y="54" text-anchor="middle" font-size="12" class="t-muted">unique per session</text>
<line x1="360" y1="72" x2="350" y2="110" class="kline" marker-end="url(#arr-ink)"/>
<rect x="490" y="0" width="220" height="72" rx="7" class="kb"/>
<text x="600.0" y="20" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">Enterprise (802.1X)</text>
<text x="600.0" y="38" text-anchor="middle" font-size="12" class="t-muted">first 256 bits of the EAP MSK</text>
<text x="600.0" y="54" text-anchor="middle" font-size="12" class="t-muted">unique per user and session</text>
<line x1="600" y1="72" x2="410" y2="110" class="kline" marker-end="url(#arr-ink)"/>
<rect x="150" y="112" width="400" height="50" rx="7" class="kb-acc"/>
<text x="350.0" y="132" text-anchor="middle" font-size="13" font-weight="600" class="t-mono kt-acc">PMK · 256 bits</text>
<text x="350.0" y="150" text-anchor="middle" font-size="12" class="t-muted">never transmitted over the air</text>
<line x1="350" y1="162" x2="350" y2="206" class="kline" marker-end="url(#arr-ink)"/>
<text x="362" y="188" font-size="11.5" class="t-mono t-muted">PRF(PMK, ANonce, SNonce, AP MAC, client MAC)</text>
<rect x="150" y="208" width="400" height="50" rx="7" class="kb-acc"/>
<text x="350.0" y="228" text-anchor="middle" font-size="13" font-weight="600" class="t-mono kt-acc">PTK · Pairwise Transient Key</text>
<text x="350.0" y="246" text-anchor="middle" font-size="12" class="t-muted">fresh every session · 384 bits with CCMP</text>
<line x1="290" y1="258" x2="120" y2="294" class="kline" marker-end="url(#arr-ink)"/>
<rect x="10" y="296" width="220" height="72" rx="7" class="kb"/>
<text x="120.0" y="316" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">KCK</text>
<text x="120.0" y="334" text-anchor="middle" font-size="12" class="t-muted">Key Confirmation Key</text>
<text x="120.0" y="350" text-anchor="middle" font-size="12" class="t-muted">computes the EAPOL-Key MIC</text>
<line x1="350" y1="258" x2="360" y2="294" class="kline" marker-end="url(#arr-ink)"/>
<rect x="250" y="296" width="220" height="72" rx="7" class="kb"/>
<text x="360.0" y="316" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">KEK</text>
<text x="360.0" y="334" text-anchor="middle" font-size="12" class="t-muted">Key Encryption Key</text>
<text x="360.0" y="350" text-anchor="middle" font-size="12" class="t-muted">encrypts the GTK in M3</text>
<line x1="410" y1="258" x2="600" y2="294" class="kline" marker-end="url(#arr-ink)"/>
<rect x="490" y="296" width="220" height="72" rx="7" class="kb"/>
<text x="600.0" y="316" text-anchor="middle" font-size="13" font-weight="600" class="t-mono">TK</text>
<text x="600.0" y="334" text-anchor="middle" font-size="12" class="t-muted">Temporal Key</text>
<text x="600.0" y="350" text-anchor="middle" font-size="12" class="t-muted">encrypts unicast data</text>
<rect x="10" y="388" width="700" height="56" rx="7" class="kb-gtk"/>
<text x="360.0" y="408" text-anchor="middle" font-size="13" font-weight="600" class="t-mono kt-gtk">GTK · Group Temporal Key</text>
<text x="360.0" y="426" text-anchor="middle" font-size="12" class="t-muted">created by the AP from its GMK · shared by all clients for broadcast/multicast · delivered in M3</text>
</g>
</svg>
