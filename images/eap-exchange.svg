<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 814" width="744" height="814" role="img" aria-label="Sequence diagram of an 802.1X/EAP exchange using PEAP between client, access point and RADIUS server: identity, TLS tunnel setup with server certificate validation, inner MSCHAPv2 authentication inside the tunnel, then RADIUS Access-Accept carrying the MSK and EAP-Success to the client.">
<style>
.bg{fill:#FFFFFF;stroke:#D3DBE1;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#15212B}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#56646F}
.ink{fill:#15212B}
.axis{stroke:#56646F;stroke-width:1;fill:none}
.grid{stroke:#D3DBE1;stroke-width:1;fill:none}
.ch-main{fill:#B25F08;fill-opacity:.16;stroke:#B25F08;stroke-width:2}
.ch-other{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#B25F08}.f5{fill:#0A7381}.f6{fill:#6947BF}
.t24{fill:#B25F08}.t5{fill:#0A7381}.t6{fill:#6947BF}
.mk{fill:#1E4E8C}.mk-ink{fill:#15212B}
.ray{stroke:#1E4E8C;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#15212B;stroke-width:3;fill:none}
.hatch{stroke:#56646F;stroke-width:1;fill:none}
.guide{stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#DAEFF1;stroke:none}
.block{fill:#56646F;fill-opacity:.55;stroke:none}
.block-soft{fill:#0A7381;fill-opacity:.22;stroke:#0A7381;stroke-width:1}
.shadow{fill:#56646F;fill-opacity:.12;stroke:none}
.wave{stroke:#0A7381;stroke-width:1.5;fill:none}
.particle{fill:#15212B}
.lifeline{stroke:#D3DBE1;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#EAEFF3;stroke:#D3DBE1;stroke-width:1}
.msg{stroke:#15212B;stroke-width:1.8;fill:none}
.msg.wired{stroke:#56646F;stroke-dasharray:5 4}
.note{fill:#EAEFF3;stroke:none}
.pre{fill:#E2EBF7;stroke:none}
.done{fill:#DFF0E6;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#FFFFFF;stroke-width:1.6}
.kb{fill:#EAEFF3;stroke:none}
.kb-acc{fill:#E2EBF7;stroke:none}
.kb-gtk{fill:#DAEFF1;stroke:none}
.kt-acc{fill:#1E4E8C}
.kt-gtk{fill:#0A7381}
.kline{stroke:#56646F;stroke-width:1.5;fill:none}
.wired-zone{fill:#EAEFF3;stroke:none}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round}
.relay{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.fld{fill:#EAEFF3;stroke:#D3DBE1;stroke-width:1}
.fld-opt{fill:#FFFFFF;stroke:#56646F;stroke-width:1;stroke-dasharray:3 3}
.fld-hi{fill:#E2EBF7;stroke:#1E4E8C;stroke-width:1}
.busy{fill:#56646F;fill-opacity:.35;stroke:none}
.ifs{fill:#FFFFFF;stroke:#56646F;stroke-width:1;stroke-dasharray:2 2}
.tx-a{fill:#1E4E8C;stroke:none}
.tx-b{fill:#0A7381;stroke:none}
.on-fill{fill:#FFFFFF}
.ackbox{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.slot{fill:#FFFFFF;stroke:#56646F;stroke-width:1}
.frozen{fill:#56646F;fill-opacity:.12;stroke:#56646F;stroke-width:1;stroke-dasharray:4 3}
.nav{fill:#6947BF;fill-opacity:.2;stroke:#6947BF;stroke-width:1}
.t-nav{fill:#6947BF}
.range-a{fill:#1E4E8C;fill-opacity:.07;stroke:#1E4E8C;stroke-width:1.2;stroke-dasharray:5 4}
.range-b{fill:#0A7381;fill-opacity:.07;stroke:#0A7381;stroke-width:1.2;stroke-dasharray:5 4}
.t-acc{fill:#1E4E8C}
.dev{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.warn-f{fill:#A0441A}
.warn-s{stroke:#A0441A;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.t-warn{fill:#A0441A}
.row-line{stroke:#D3DBE1;stroke-width:1;fill:none}
@media (prefers-color-scheme: dark){
.bg{fill:#141C23;stroke:#29353F;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E2E8ED}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#98A5AF}
.ink{fill:#E2E8ED}
.axis{stroke:#98A5AF;stroke-width:1;fill:none}
.grid{stroke:#29353F;stroke-width:1;fill:none}
.ch-main{fill:#EDA24E;fill-opacity:.16;stroke:#EDA24E;stroke-width:2}
.ch-other{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#EDA24E}.f5{fill:#4CC1CD}.f6{fill:#AE95F3}
.t24{fill:#EDA24E}.t5{fill:#4CC1CD}.t6{fill:#AE95F3}
.mk{fill:#8DB4EE}.mk-ink{fill:#E2E8ED}
.ray{stroke:#8DB4EE;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#E2E8ED;stroke-width:3;fill:none}
.hatch{stroke:#98A5AF;stroke-width:1;fill:none}
.guide{stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#0E2A2E;stroke:none}
.block{fill:#98A5AF;fill-opacity:.55;stroke:none}
.block-soft{fill:#4CC1CD;fill-opacity:.22;stroke:#4CC1CD;stroke-width:1}
.shadow{fill:#98A5AF;fill-opacity:.12;stroke:none}
.wave{stroke:#4CC1CD;stroke-width:1.5;fill:none}
.particle{fill:#E2E8ED}
.lifeline{stroke:#29353F;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#1C2630;stroke:#29353F;stroke-width:1}
.msg{stroke:#E2E8ED;stroke-width:1.8;fill:none}
.msg.wired{stroke:#98A5AF;stroke-dasharray:5 4}
.note{fill:#1C2630;stroke:none}
.pre{fill:#1A2A3E;stroke:none}
.done{fill:#13281C;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#141C23;stroke-width:1.6}
.kb{fill:#1C2630;stroke:none}
.kb-acc{fill:#1A2A3E;stroke:none}
.kb-gtk{fill:#0E2A2E;stroke:none}
.kt-acc{fill:#8DB4EE}
.kt-gtk{fill:#4CC1CD}
.kline{stroke:#98A5AF;stroke-width:1.5;fill:none}
.wired-zone{fill:#1C2630;stroke:none}
.halo{paint-order:stroke;stroke:#141C23;stroke-width:5px;stroke-linejoin:round}
.relay{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.fld{fill:#1C2630;stroke:#29353F;stroke-width:1}
.fld-opt{fill:#141C23;stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3}
.fld-hi{fill:#1A2A3E;stroke:#8DB4EE;stroke-width:1}
.busy{fill:#98A5AF;fill-opacity:.35;stroke:none}
.ifs{fill:#141C23;stroke:#98A5AF;stroke-width:1;stroke-dasharray:2 2}
.tx-a{fill:#8DB4EE;stroke:none}
.tx-b{fill:#4CC1CD;stroke:none}
.on-fill{fill:#141C23}
.ackbox{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.slot{fill:#141C23;stroke:#98A5AF;stroke-width:1}
.frozen{fill:#98A5AF;fill-opacity:.12;stroke:#98A5AF;stroke-width:1;stroke-dasharray:4 3}
.nav{fill:#AE95F3;fill-opacity:.2;stroke:#AE95F3;stroke-width:1}
.t-nav{fill:#AE95F3}
.range-a{fill:#8DB4EE;fill-opacity:.07;stroke:#8DB4EE;stroke-width:1.2;stroke-dasharray:5 4}
.range-b{fill:#4CC1CD;fill-opacity:.07;stroke:#4CC1CD;stroke-width:1.2;stroke-dasharray:5 4}
.t-acc{fill:#8DB4EE}
.dev{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.warn-f{fill:#EE9467}
.warn-s{stroke:#EE9467;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.t-warn{fill:#EE9467}
.row-line{stroke:#29353F;stroke-width:1;fill:none}
}</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-ink"/></marker>
<pattern id="dfs-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="f5"/><line x1="0" y1="0" x2="0" y2="5" class="hatch-line"/></pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="743" height="813" rx="10"/>
<g transform="translate(12,12)">
<rect x="30" y="10" width="140" height="44" rx="6" class="actor"/>
              <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="600">Client</text>
              <text x="100" y="46" text-anchor="middle" font-size="11.5" class="t-muted">Supplicant</text>
              <rect x="285" y="10" width="150" height="44" rx="6" class="actor"/>
              <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600">Access point</text>
              <text x="360" y="46" text-anchor="middle" font-size="11.5" class="t-muted">Authenticator</text>
              <rect x="545" y="10" width="150" height="44" rx="6" class="actor"/>
              <text x="620" y="30" text-anchor="middle" font-size="14" font-weight="600">RADIUS server</text>
              <text x="620" y="46" text-anchor="middle" font-size="11.5" class="t-muted">Authentication server</text>
              <line x1="100" y1="54" x2="100" y2="730" class="lifeline"/>
              <line x1="360" y1="54" x2="360" y2="730" class="lifeline"/>
              <line x1="620" y1="54" x2="620" y2="730" class="lifeline"/>
              <rect x="100" y="66" width="260" height="28" class="pre"/>
              <rect x="360" y="66" width="260" height="28" class="wired-zone"/>
              <text x="230" y="84" text-anchor="middle" font-size="12">EAP in EAPOL frames · over the air</text>
              <text x="490" y="84" text-anchor="middle" font-size="12">EAP in RADIUS · wired network</text>
              <line x1="40" y1="114" x2="680" y2="114" class="grid"/>
              <text x="360" y="118" text-anchor="middle" font-size="11" class="t-mono t-muted halo" letter-spacing="0.06em">1 · IDENTITY</text>
              <text x="230" y="140" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">EAPOL-Start (optional)</text>
              <line x1="102" y1="148" x2="356" y2="148" class="msg" marker-end="url(#arr-ink)"/>
              <text x="230" y="174" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">EAP-Request / Identity</text>
              <line x1="358" y1="182" x2="104" y2="182" class="msg" marker-end="url(#arr-ink)"/>
              <text x="360" y="206" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">EAP-Response / Identity</text>
              <text x="360" y="220" text-anchor="middle" font-size="11" class="t-mono t-muted halo">outer identity, e.g. anonymous@corp.example</text>
              <line x1="102" y1="230" x2="616" y2="230" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="230" r="3.5" class="relay"/>
              <line x1="40" y1="256" x2="680" y2="256" class="grid"/>
              <text x="360" y="260" text-anchor="middle" font-size="11" class="t-mono t-muted halo" letter-spacing="0.06em">2 · TLS TUNNEL SETUP (PEAP PHASE 1)</text>
              <text x="360" y="282" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">EAP-Request / PEAP-Start</text>
              <line x1="618" y1="290" x2="104" y2="290" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="290" r="3.5" class="relay"/>
              <text x="360" y="314" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">TLS ClientHello</text>
              <line x1="102" y1="322" x2="616" y2="322" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="322" r="3.5" class="relay"/>
              <text x="360" y="346" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">TLS ServerHello · Certificate · ServerHelloDone</text>
              <line x1="618" y1="354" x2="104" y2="354" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="354" r="3.5" class="relay"/>
              <rect x="110" y="364" width="240" height="26" rx="5" class="note"/>
              <text x="122" y="381" font-size="12" class="t-muted"><tspan font-weight="600" class="ink">Validates</tspan> the server certificate</text>
              <text x="360" y="414" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">TLS key exchange · Finished</text>
              <line x1="102" y1="422" x2="616" y2="422" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="422" r="3.5" class="relay"/>
              <text x="360" y="446" text-anchor="middle" font-size="13" class="t-mono halo" font-weight="600">TLS Finished</text>
              <line x1="618" y1="454" x2="104" y2="454" class="msg" marker-end="url(#arr-ink)"/>
              <circle cx="360" cy="454" r="3.5" class="relay"/>
              <line x1="40" y1="480" x2="680" y2="480" class="grid"/>
              <text x="360" y="484" text-anchor="middle" font-size="11" class="t-mono t-muted halo" letter-spacing="0.06em">3 · INNER AUTH INSIDE THE TUNNEL (PEAP PHASE 2)</text>
              <rect x="90" y="494" width="540" height="84" rx="8" class="pre"/>
              <text x="110" y="509" font-size="11" class="t-muted">encrypted TLS tunnel · the AP relays it but can’t read it</text>
              <text x="360" y="526" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">Identity + MSCHAPv2 challenge</text>
              <line x1="618" y1="534" x2="104" y2="534" class="msg" marker-end="url(#arr-ink)"/>
              <text x="360" y="556" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">MSCHAPv2 response (proves the password)</text>
              <line x1="102" y1="564" x2="616" y2="564" class="msg" marker-end="url(#arr-ink)"/>
              <line x1="40" y1="600" x2="680" y2="600" class="grid"/>
              <text x="360" y="604" text-anchor="middle" font-size="11" class="t-mono t-muted halo" letter-spacing="0.06em">4 · RESULT</text>
              <text x="490" y="628" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">RADIUS Access-Accept</text>
              <text x="490" y="642" text-anchor="middle" font-size="11" class="t-mono t-muted">EAP-Success + MSK (MS-MPPE keys)</text>
              <line x1="618" y1="650" x2="364" y2="650" class="msg" marker-end="url(#arr-ink)"/>
              <rect x="110" y="660" width="240" height="26" rx="5" class="note"/>
              <text x="122" y="677" font-size="12" class="t-muted">Derives the same MSK from TLS</text>
              <text x="230" y="706" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">EAP-Success</text>
              <line x1="358" y1="714" x2="104" y2="714" class="msg" marker-end="url(#arr-ink)"/>
              <rect x="60" y="730" width="600" height="46" rx="6" class="done"/>
              <text x="360" y="749" text-anchor="middle" font-size="12.5">Client and AP now share the <tspan font-weight="600">MSK</tspan> → PMK = its first 256 bits</text>
              <text x="360" y="766" text-anchor="middle" font-size="12" class="t-muted">Next: 4-way handshake (section 4). The AP opens the port only after that.</text>
</g>
</svg>
