<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 274" width="744" height="274" role="img" aria-label="CSMA/CA timeline: after the medium goes idle both stations wait DIFS and count down random backoff slots. Station A reaches zero first and transmits; the AP ACKs after SIFS. Station B freezes its backoff with 2 slots left, sets its NAV, and resumes after the next DIFS.">
<style>
