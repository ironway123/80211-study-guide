<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 624" width="744" height="624" role="img" aria-label="Sequence diagram of the WPA3 SAE exchange: client and AP each send a Commit carrying a scalar and an element, both compute the same secret, then each sends a Confirm proving it. The result is the PMK used by the 4-way handshake.">
<style>
.bg{fill:#FFFFFF;stroke:#D3DBE1;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#15212B}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#56646F}
.ink{fill:#15212B}
.axis{stroke:#56646F;stroke-width:1;fill:none}
.grid{stroke:#D3DBE1;stroke-width:1;fill:none}
.ch-main{fill:#B25F08;fill-opacity:.16;stroke:#B25F08;stroke-width:2}
.ch-other{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#56646F;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#B25F08}.f5{fill:#0A7381}.f6{fill:#6947BF}
.t24{fill:#B25F08}.t5{fill:#0A7381}.t6{fill:#6947BF}
.mk{fill:#1E4E8C}.mk-ink{fill:#15212B}
.ray{stroke:#1E4E8C;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#15212B;stroke-width:3;fill:none}
.hatch{stroke:#56646F;stroke-width:1;fill:none}
.guide{stroke:#56646F;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#DAEFF1;stroke:none}
.block{fill:#56646F;fill-opacity:.55;stroke:none}
.block-soft{fill:#0A7381;fill-opacity:.22;stroke:#0A7381;stroke-width:1}
.shadow{fill:#56646F;fill-opacity:.12;stroke:none}
.wave{stroke:#0A7381;stroke-width:1.5;fill:none}
.particle{fill:#15212B}
.lifeline{stroke:#D3DBE1;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#EAEFF3;stroke:#D3DBE1;stroke-width:1}
.msg{stroke:#15212B;stroke-width:1.8;fill:none}
.msg.wired{stroke:#56646F;stroke-dasharray:5 4}
.note{fill:#EAEFF3;stroke:none}
.pre{fill:#E2EBF7;stroke:none}
.done{fill:#DFF0E6;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#FFFFFF;stroke-width:1.6}
.kb{fill:#EAEFF3;stroke:none}
.kb-acc{fill:#E2EBF7;stroke:none}
.kb-gtk{fill:#DAEFF1;stroke:none}
.kt-acc{fill:#1E4E8C}
.kt-gtk{fill:#0A7381}
.kline{stroke:#56646F;stroke-width:1.5;fill:none}
.wired-zone{fill:#EAEFF3;stroke:none}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round}
.relay{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.fld{fill:#EAEFF3;stroke:#D3DBE1;stroke-width:1}
.fld-opt{fill:#FFFFFF;stroke:#56646F;stroke-width:1;stroke-dasharray:3 3}
.fld-hi{fill:#E2EBF7;stroke:#1E4E8C;stroke-width:1}
.busy{fill:#56646F;fill-opacity:.35;stroke:none}
.ifs{fill:#FFFFFF;stroke:#56646F;stroke-width:1;stroke-dasharray:2 2}
.tx-a{fill:#1E4E8C;stroke:none}
.tx-b{fill:#0A7381;stroke:none}
.on-fill{fill:#FFFFFF}
.ackbox{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.slot{fill:#FFFFFF;stroke:#56646F;stroke-width:1}
.frozen{fill:#56646F;fill-opacity:.12;stroke:#56646F;stroke-width:1;stroke-dasharray:4 3}
.nav{fill:#6947BF;fill-opacity:.2;stroke:#6947BF;stroke-width:1}
.t-nav{fill:#6947BF}
.range-a{fill:#1E4E8C;fill-opacity:.07;stroke:#1E4E8C;stroke-width:1.2;stroke-dasharray:5 4}
.range-b{fill:#0A7381;fill-opacity:.07;stroke:#0A7381;stroke-width:1.2;stroke-dasharray:5 4}
.t-acc{fill:#1E4E8C}
.dev{fill:#FFFFFF;stroke:#15212B;stroke-width:1.5}
.warn-f{fill:#A0441A}
.warn-s{stroke:#A0441A;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.t-warn{fill:#A0441A}
.row-line{stroke:#D3DBE1;stroke-width:1;fill:none}
@media (prefers-color-scheme: dark){
.bg{fill:#141C23;stroke:#29353F;stroke-width:1}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E2E8ED}
.t-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-muted{fill:#98A5AF}
.ink{fill:#E2E8ED}
.axis{stroke:#98A5AF;stroke-width:1;fill:none}
.grid{stroke:#29353F;stroke-width:1;fill:none}
.ch-main{fill:#EDA24E;fill-opacity:.16;stroke:#EDA24E;stroke-width:2}
.ch-other{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.ch-jp{fill:none;stroke:#98A5AF;stroke-width:1;stroke-dasharray:1 3;opacity:.6}
.f24{fill:#EDA24E}.f5{fill:#4CC1CD}.f6{fill:#AE95F3}
.t24{fill:#EDA24E}.t5{fill:#4CC1CD}.t6{fill:#AE95F3}
.mk{fill:#8DB4EE}.mk-ink{fill:#E2E8ED}
.ray{stroke:#8DB4EE;stroke-width:2;fill:none;stroke-linecap:round}
.ray.thin{stroke-width:1.3}
.surf{stroke:#E2E8ED;stroke-width:3;fill:none}
.hatch{stroke:#98A5AF;stroke-width:1;fill:none}
.guide{stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3;fill:none}
.medium{fill:#0E2A2E;stroke:none}
.block{fill:#98A5AF;fill-opacity:.55;stroke:none}
.block-soft{fill:#4CC1CD;fill-opacity:.22;stroke:#4CC1CD;stroke-width:1}
.shadow{fill:#98A5AF;fill-opacity:.12;stroke:none}
.wave{stroke:#4CC1CD;stroke-width:1.5;fill:none}
.particle{fill:#E2E8ED}
.lifeline{stroke:#29353F;stroke-width:2;stroke-dasharray:5 4;fill:none}
.actor{fill:#1C2630;stroke:#29353F;stroke-width:1}
.msg{stroke:#E2E8ED;stroke-width:1.8;fill:none}
.msg.wired{stroke:#98A5AF;stroke-dasharray:5 4}
.note{fill:#1C2630;stroke:none}
.pre{fill:#1A2A3E;stroke:none}
.done{fill:#13281C;stroke:none}
.dfs{fill:url(#dfs-hatch)}
.hatch-line{stroke:#141C23;stroke-width:1.6}
.kb{fill:#1C2630;stroke:none}
.kb-acc{fill:#1A2A3E;stroke:none}
.kb-gtk{fill:#0E2A2E;stroke:none}
.kt-acc{fill:#8DB4EE}
.kt-gtk{fill:#4CC1CD}
.kline{stroke:#98A5AF;stroke-width:1.5;fill:none}
.wired-zone{fill:#1C2630;stroke:none}
.halo{paint-order:stroke;stroke:#141C23;stroke-width:5px;stroke-linejoin:round}
.relay{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.fld{fill:#1C2630;stroke:#29353F;stroke-width:1}
.fld-opt{fill:#141C23;stroke:#98A5AF;stroke-width:1;stroke-dasharray:3 3}
.fld-hi{fill:#1A2A3E;stroke:#8DB4EE;stroke-width:1}
.busy{fill:#98A5AF;fill-opacity:.35;stroke:none}
.ifs{fill:#141C23;stroke:#98A5AF;stroke-width:1;stroke-dasharray:2 2}
.tx-a{fill:#8DB4EE;stroke:none}
.tx-b{fill:#4CC1CD;stroke:none}
.on-fill{fill:#141C23}
.ackbox{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.slot{fill:#141C23;stroke:#98A5AF;stroke-width:1}
.frozen{fill:#98A5AF;fill-opacity:.12;stroke:#98A5AF;stroke-width:1;stroke-dasharray:4 3}
.nav{fill:#AE95F3;fill-opacity:.2;stroke:#AE95F3;stroke-width:1}
.t-nav{fill:#AE95F3}
.range-a{fill:#8DB4EE;fill-opacity:.07;stroke:#8DB4EE;stroke-width:1.2;stroke-dasharray:5 4}
.range-b{fill:#4CC1CD;fill-opacity:.07;stroke:#4CC1CD;stroke-width:1.2;stroke-dasharray:5 4}
.t-acc{fill:#8DB4EE}
.dev{fill:#141C23;stroke:#E2E8ED;stroke-width:1.5}
.warn-f{fill:#EE9467}
.warn-s{stroke:#EE9467;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.t-warn{fill:#EE9467}
.row-line{stroke:#29353F;stroke-width:1;fill:none}
}</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-ink"/></marker>
<pattern id="dfs-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="f5"/><line x1="0" y1="0" x2="0" y2="5" class="hatch-line"/></pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="743" height="623" rx="10"/>
<g transform="translate(12,12)">
<rect x="40" y="10" width="180" height="44" rx="6" class="actor"/>
              <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="600">Client</text>
              <text x="130" y="46" text-anchor="middle" font-size="11.5" class="t-muted">SAE peer</text>
              <rect x="500" y="10" width="180" height="44" rx="6" class="actor"/>
              <text x="590" y="30" text-anchor="middle" font-size="14" font-weight="600">Access point</text>
              <text x="590" y="46" text-anchor="middle" font-size="11.5" class="t-muted">SAE peer</text>
              <line x1="130" y1="54" x2="130" y2="540" class="lifeline"/>
              <line x1="590" y1="54" x2="590" y2="540" class="lifeline"/>

              <rect x="60" y="70" width="600" height="46" rx="6" class="pre"/>
              <text x="360" y="89" text-anchor="middle" font-size="12.5">Both know the <tspan font-weight="600">password</tspan> · each derives the same Password Element (PWE)</text>
              <text x="360" y="106" text-anchor="middle" font-size="12" class="t-muted">a curve point from the password + both MAC addresses (H2E also mixes in the SSID)</text>

              <rect x="140" y="130" width="210" height="58" rx="5" class="note"/>
              <text x="152" y="148" font-size="12" class="t-muted">Picks secret random rand, mask</text>
              <text x="152" y="164" font-size="11" class="t-mono t-muted">scalar  = rand + mask</text>
              <text x="152" y="179" font-size="11" class="t-mono t-muted">element = −(mask · PWE)</text>
              <rect x="370" y="130" width="210" height="58" rx="5" class="note"/>
              <text x="568" y="148" font-size="12" class="t-muted" text-anchor="end">Picks its own rand, mask</text>
              <text x="568" y="164" font-size="11" class="t-mono t-muted" text-anchor="end">scalar  = rand + mask</text>
              <text x="568" y="179" font-size="11" class="t-mono t-muted" text-anchor="end">element = −(mask · PWE)</text>

              <!-- Commits -->
              <text x="360" y="212" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">Commit · Auth frame, seq 1</text>
              <text x="360" y="227" text-anchor="middle" font-size="11" class="t-mono t-muted">group · scalar · element</text>
              <line x1="132" y1="236" x2="586" y2="236" class="msg" marker-end="url(#arr-ink)"/>
              <text x="360" y="262" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">Commit · Auth frame, seq 1</text>
              <text x="360" y="277" text-anchor="middle" font-size="11" class="t-mono t-muted">group · scalar · element</text>
              <line x1="588" y1="286" x2="134" y2="286" class="msg" marker-end="url(#arr-ink)"/>

              <rect x="60" y="302" width="600" height="50" rx="6" class="note"/>
              <text x="360" y="322" text-anchor="middle" font-size="12.5">Each side computes the same secret <tspan class="t-mono" font-weight="600">K = rand · (peer-scalar · PWE + peer-element)</tspan></text>
              <text x="360" y="340" text-anchor="middle" font-size="12" class="t-muted">KDF(K) → KCK (for Confirm) + PMK (for the 4-way handshake) · eavesdroppers lack rand</text>

              <!-- Confirms -->
              <text x="360" y="380" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">Confirm · Auth frame, seq 2</text>
              <text x="360" y="395" text-anchor="middle" font-size="11" class="t-mono t-muted">HMAC(KCK, counter, both scalars + elements)</text>
              <line x1="132" y1="404" x2="586" y2="404" class="msg" marker-end="url(#arr-ink)"/>
              <rect x="340" y="414" width="240" height="26" rx="5" class="note"/>
              <text x="568" y="431" font-size="12" class="t-muted" text-anchor="end">Checks it → client knows the password</text>

              <text x="360" y="466" text-anchor="middle" font-size="13" class="t-mono" font-weight="600">Confirm · Auth frame, seq 2</text>
              <text x="360" y="481" text-anchor="middle" font-size="11" class="t-mono t-muted">HMAC(KCK, counter, both scalars + elements)</text>
              <line x1="588" y1="490" x2="134" y2="490" class="msg" marker-end="url(#arr-ink)"/>
              <rect x="140" y="500" width="240" height="26" rx="5" class="note"/>
              <text x="152" y="517" font-size="12" class="t-muted">Checks it → AP knows the password</text>

              <rect x="60" y="540" width="600" height="46" rx="6" class="done"/>
              <text x="360" y="559" text-anchor="middle" font-size="12.5">Both proved they know the password without revealing it · <tspan font-weight="600">PMK</tspan> is shared</text>
              <text x="360" y="576" text-anchor="middle" font-size="12" class="t-muted">Next: Association Request/Response → 4-way handshake (section 4)</text>
</g>
</svg>
